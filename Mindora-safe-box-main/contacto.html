<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MINDORA - Contacto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">MINDORA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="proyectos.html">Proyectos</a></li>
          <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
          <li class="nav-item"><a class="nav-link" href="quienes-somos.html">Quienes somos</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <h1 class="section-title mb-3">Contacto</h1>
    <p class="text-muted">Formulario de ejemplo (no envía sin backend).</p>

    <div class="row g-4">
      <div class="col-lg-6">
        <form class="card shadow-sm p-3 p-md-4">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input class="form-control" type="text" placeholder="Tu nombre">
          </div>
          <div class="mb-3">
            <label class="form-label">Correo</label>
            <input class="form-control" type="email" placeholder="tucorreo@ejemplo.com">
          </div>
          <div class="mb-3">
            <label class="form-label">Mensaje</label>
            <textarea class="form-control" rows="4" placeholder="Cuéntanos qué necesitas..."></textarea>
          </div>
          <button type="button" class="btn btn-primary">Enviar (demo)</button>
        </form>
      </div>

      <div class="col-lg-6">
        <div class="card shadow-sm p-3 p-md-4">
          <h5 class="fw-bold">Información</h5>
          <p class="mb-2"><strong>Email:</strong> safeboxmindora@gmail.com</p>
          <p class="mb-2"><strong>Tel:</strong> +57 316 2843390</p>
          <p class="mb-0"><strong>Ubicación:</strong> Colombia</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 border-top">
    <div class="container text-muted">© <span id="year"></span> Mindora Safe Box</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/logging.js"></script>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
